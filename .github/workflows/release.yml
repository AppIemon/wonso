name: release
on:
  push:
    tags:
      - "v*"
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - name: Build Fabric jar
        working-directory: wonso-mod
        run: ./gradlew build --no-daemon
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: wonso ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
          files: wonso-mod/build/libs/wonso-0.1.0-alpha.jar
          generate_release_notes: true
          body: |
            Minecraft **26.2 Fabric** 모드 JAR.

            ## 설치
            1. Fabric Loader 0.19.3+ 로 26.2 프로필 설치
            2. Fabric API `0.158.0+26.2` 를 `mods/` 에 넣기
            3. 아래 `wonso-0.1.0-alpha.jar` 를 같은 `mods/` 에 넣기
            4. 런처 Java **25**

            바닐라 / 1.21.x / 26.1 에는 맞지 않습니다.
